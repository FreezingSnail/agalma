[workspace]
resolver = "2"
members = [
    "crates/agalma-contracts",
    "crates/agalma-ipc",
    "crates/agalma-ledger",
    "crates/agalma-execution",
    "crates/agalma-sandbox",
    "crates/agalma-process",
    "crates/agalma-workspace",
    "crates/agalma-taskqueue",
    "crates/agalma-decision",
    "crates/agalma-harness-opencode",
    "crates/agalma-harness-reference",
    "crates/agalma-conductor",
    "crates/agalma-kernel",
    "crates/agalma-testkit",
]
# Spike packages are standalone; they are not part of the product workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Pinned per docs/m0-dependencies.md. Exact `=` versions; `cargo update` is a
# reviewed change. No crate beyond this shortlist may be fetched without
# explicit user approval.
[workspace.dependencies]
tokio = { version = "=1.53.2", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "time",
    "sync",
    "signal",
    "io-util",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
# Paid provider proxy TLS (approved for agalma-csw.2). `ring` avoids the
# aws-lc-rs build toolchain; roots come from webpki-roots (no system store).
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.9"
# Canonical SHA-256 for revision-1 self-mutation identities (design gate
# agalma-fjq). Already a transitive dependency of the rustls closure above; the
# pure digest helper in `agalma-contracts` (`canonical-json/v1` + `sha256:`) is
# its only product user. No dependency download here.
ring = "=0.17.14"
# IPC v2 ConnectRPC transport (approved 2026-10-11; design:
# docs/ipc-connect-design.md D2). `agalma-ipc` only. No TLS/compression/
# protobuf-JSON features.
connectrpc = { version = "=0.9.1", default-features = false, features = ["server", "client"] }
buffa = "=0.9.2"
connectrpc-build = "=0.9.0"
# Build-only helper used by agalma-ipc/build.rs to assemble the ipc.proto
# descriptor set in-process (protoc/buf are not available offline). Already a
# transitive dependency of connectrpc-build; no new download.
buffa-codegen = "=0.9.2"
# HTTP/2 plumbing for the UDS accept loop. All arrivals through the approved
# connectrpc closure (design D2); `agalma-ipc` only.
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio", "http1", "http2"] }
tower = { version = "=0.5.3", features = ["util"] }
http = "=1.5.0"
# Full-screen TUI (TUI.6, agalma-3kr.7; approved 2026-10-11, docs/tui-design.md).
# `agalma-conductor` only. ratatui's default backend is crossterm; ratatui-crossterm
# binds crossterm 0.29, which the direct pin below unifies with.
ratatui = "=0.30.2"
crossterm = "=0.29.0"

# Debug-profile size control for the workspace and every isolated worktree
# cache (CARGO_TARGET_DIR=target/worktree-caches/<bead>/target). Full DWARF
# (`debug = true`, the default) made dependency rlibs and native test binaries
# several times larger than the code they carry: the agalma-ipc codegen rlib
# alone reached 161 MiB and test executables 29-58 MiB each. `debug = 1` keeps
# file/line backtraces at a small fraction of the bytes. Changing this value
# changes artifact fingerprints, so the next build recompiles once; that cost is
# expected, not a defect.
[profile.dev]
debug = 1

# Evidence and isolated-cache runs disable incremental compilation by default
# (Makefile: CARGO_INCREMENTAL ?= 0). Incremental IR was the single largest
# per-cache consumer (0.9-1.3 GiB each) and cannot be shared across caches.
# Local iterative work can opt back in with CARGO_INCREMENTAL=1.

