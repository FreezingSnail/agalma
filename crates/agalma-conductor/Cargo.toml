[package]
name = "agalma-conductor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agalma conductor: CLI (`agalma`), composition root, and daemon. Owning wave: M0.1 (skeleton) / M0.7 (smoke)."
publish = false

[[bin]]
name = "agalma"
path = "src/main.rs"

[lib]
name = "agalma_conductor"
path = "src/lib.rs"

[dependencies]
agalma-contracts = { path = "../agalma-contracts" }
agalma-ledger = { path = "../agalma-ledger" }
agalma-execution = { path = "../agalma-execution" }
agalma-process = { path = "../agalma-process" }
agalma-workspace = { path = "../agalma-workspace" }
agalma-harness-opencode = { path = "../agalma-harness-opencode" }
agalma-harness-reference = { path = "../agalma-harness-reference" }
agalma-ipc = { path = "../agalma-ipc" }
agalma-taskqueue = { path = "../agalma-taskqueue" }
agalma-decision = { path = "../agalma-decision" }
agalma-kernel = { path = "../agalma-kernel" }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
agalma-testkit = { path = "../agalma-testkit" }
