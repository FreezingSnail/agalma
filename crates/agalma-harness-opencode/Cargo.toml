[package]
name = "agalma-harness-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agalma OpenCode harness adapter. Owning wave: M0.6 — vendor details confined here."
publish = false

# The harness launches `opencode serve` through the extracted
# `agalma_contracts::ProcessApi` boundary. The server builds its own
# `agalma_process::LocalLauncher` (no confinement profile), so `agalma-sandbox`
# is gone entirely.
[dependencies]
agalma-contracts = { path = "../agalma-contracts" }
agalma-ipc = { path = "../agalma-ipc" }
agalma-process = { path = "../agalma-process" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
agalma-testkit = { path = "../agalma-testkit" }
